[project]
name = "mosaic-drishti"
version = "0.1.0"
description = ""
authors = [
    {name = "Bhanu Bhadouria",email = "bhanubhadouria123@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "loguru (>=0.7.3,<0.8.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "anthropic (>=0.103.0,<0.104.0)",
    "yfinance (>=1.3.0,<2.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.47.0,<0.48.0)",
    "streamlit (>=1.57.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "mosaic_drishti", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.13,<0.16.0)"
]
