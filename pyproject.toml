[project]
name = "mosaic-drishti"
version = "0.1.0"
description = ""
authors = [
    {name = "Bhanu Bhadouria",email = "bhanubhadouria123@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "loguru (>=0.7.3,<0.8.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "yfinance (>=1.3.0,<2.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.47.0,<0.48.0)",
    "streamlit (>=1.57.0,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "openai (>=3.45.0,<4.0.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)"
]

[tool.poetry]
packages = [{include = "mosaic_drishti", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.13,<0.16.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "pytest-socket (>=0.8.1,<0.9.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pandas-stubs (>=3.0.0.260204,<4.0.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the local Postgres test database (run with make test-integration)"]
# No test may reach the internet; plain `pytest` runs only the fast unit tests
addopts = "--disable-socket -m 'not integration'"
